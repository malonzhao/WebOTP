name: Release
run-name: Release ${{ inputs.tag || github.ref_name }}

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish using the workflow on main
        required: true
        type: string

permissions:
  contents: read

# Serialize publication, including manual retries of older tags.
concurrency:
  group: webotp-release
  cancel-in-progress: false

jobs:
  prepare:
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.name }}
      tag: ${{ steps.image.outputs.tag }}
      sha: ${{ steps.image.outputs.sha }}
      existing: ${{ steps.existing.outputs.image }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate release tag
        id: image
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || { echo 'Expected a stable vMAJOR.MINOR.PATCH tag'; exit 1; }
          sha=$(git rev-parse --verify "refs/tags/$TAG^{commit}")
          git checkout --detach "$sha"
          version=$(node -p "require('./package.json').version")
          [[ "$TAG" == "v$version" ]] || { echo 'Tag does not match package.json'; exit 1; }
          git merge-base --is-ancestor HEAD origin/main || { echo 'Release commit must belong to main'; exit 1; }
          image_owner=$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE=ghcr.io/${image_owner}/webotp" >> "$GITHUB_ENV"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "name=ghcr.io/${image_owner}/webotp" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check for an already published version
        id: existing
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # A retry reuses the existing version image instead of overwriting it.
          if docker buildx imagetools inspect "$IMAGE:$TAG" 2> "$RUNNER_TEMP/image-inspect-error"; then
            echo 'image=true' >> "$GITHUB_OUTPUT"
          else
            cat "$RUNNER_TEMP/image-inspect-error" >&2
            # Network/auth failures must not be treated as a missing image.
            grep -Eqi 'manifest unknown|not found' "$RUNNER_TEMP/image-inspect-error" || exit 1
            releases=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[].tag_name')
            # Do not rebuild an image belonging to an existing release.
            if grep -Fxq "$TAG" <<< "$releases"; then
              echo 'Release exists but its image cannot be read'; exit 1
            fi
            echo 'image=false' >> "$GITHUB_OUTPUT"
          fi

  validate:
    needs: prepare
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.prepare.outputs.sha }}

  build:
    needs: [prepare, validate]
    if: needs.prepare.outputs.existing != 'true'
    uses: ./.github/workflows/build-images.yml
    permissions:
      contents: read
      packages: write
    with:
      sha: ${{ needs.prepare.outputs.sha }}
      tag: ${{ needs.prepare.outputs.tag }}
      image: ${{ needs.prepare.outputs.image }}

  publish:
    needs: [prepare, validate, build]
    if: ${{ always() && !cancelled() && needs.prepare.result == 'success' && needs.validate.result == 'success' && (needs.build.result == 'success' || needs.prepare.outputs.existing == 'true') }}
    uses: ./.github/workflows/publish-release.yml
    permissions:
      contents: write
      packages: write
    with:
      tag: ${{ needs.prepare.outputs.tag }}
      image: ${{ needs.prepare.outputs.image }}
      existing: ${{ needs.prepare.outputs.existing == 'true' }}
